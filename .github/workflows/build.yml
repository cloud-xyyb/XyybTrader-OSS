# CI: build + regression (ubuntu-22.04)
name: build

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  build-and-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -V ca-certificates lsb-release wget \
            build-essential cmake ninja-build libcurl4-openssl-dev libssl-dev \
            libboost-dev libboost-system-dev
          # Apache Arrow / Parquet 官方 apt 源 (https://arrow.apache.org/install/)
          wget "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y -V ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update
          sudo apt-get install -y -V libarrow-dev libparquet-dev

      - name: Build public targets and strategy plugins
        run: bash scripts/build_dev.sh

      - name: Tests and byte-identical regression
        run: python3 scripts/validate_dev.py
